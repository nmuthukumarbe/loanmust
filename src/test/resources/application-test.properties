# Test profile: in-memory H2, schema created from the entities, demo book seeded.
spring.datasource.url=jdbc:h2:mem:loanmust;MODE=MariaDB;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.thymeleaf.cache=false
app.demo.seed-transactions=true
app.storage.local-dir=target/test-storage
app.payout.overdue-cron=-
