<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{fragments/layout}">
<head><title>Change password</title></head>
<body>
<div layout:fragment="page-title">Change password</div>
<div layout:fragment="content">
    <div class="max-w-md">
        <div th:if="${required}" class="mb-5 rounded-xl bg-amber-50 border border-amber-200 px-4 py-3 text-sm text-amber-800">
            <i class="bi bi-shield-exclamation"></i>
            Choose your own password before you carry on.
        </div>
        <form th:action="@{/account/password}" method="post" class="card p-6 space-y-5">
            <div>
                <label class="form-label">Current password</label>
                <input type="password" name="currentPassword" required autocomplete="current-password" class="form-input"/>
            </div>
            <div>
                <label class="form-label">New password</label>
                <input type="password" name="newPassword" required minlength="8" autocomplete="new-password" class="form-input"/>
                <p class="text-xs text-slate-400 mt-1">At least 8 characters.</p>
            </div>
            <div>
                <label class="form-label">Confirm new password</label>
                <input type="password" name="confirmPassword" required minlength="8" autocomplete="new-password" class="form-input"/>
            </div>
            <button type="submit" class="btn btn-primary w-full"><i class="bi bi-key"></i> Change password</button>
        </form>
    </div>
</div>
</body>
</html>
