<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{fragments/layout}">
<head><title>No access</title></head>
<body>
<div layout:fragment="page-title">Access restricted</div>
<div layout:fragment="content">
    <div class="card p-10 text-center max-w-lg mx-auto mt-6">
        <div class="h-16 w-16 rounded-2xl bg-rose-50 text-rose-500 grid place-items-center mx-auto mb-4">
            <i class="bi bi-shield-lock text-3xl"></i>
        </div>
        <h2 class="font-display font-bold text-xl">You don't have access to <span th:text="${moduleLabel}">this screen</span></h2>
        <p class="text-sm text-slate-500 mt-2">
            Your role hasn't been granted permission for this screen. If you need it, ask an administrator
            to enable it under <b>Users &amp; Roles → Roles &amp; Permissions</b>.
        </p>
        <a th:href="@{/dashboard}" class="btn btn-primary mt-6"><i class="bi bi-house"></i> Back to dashboard</a>
    </div>
</div>
</body>
</html>
