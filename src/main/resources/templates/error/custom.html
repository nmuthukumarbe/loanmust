<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}"/>
    <title th:text="(${title} ?: 'Something went wrong') + ' · Loanmust'">Something went wrong</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: {
            fontFamily: { display: ['"Plus Jakarta Sans"','sans-serif'], sans: ['Inter','sans-serif'] },
            colors: { canvas:'#F4F6FB', ink:'#0F172A', brand: { 50:'#eef2ff',600:'#4f46e5',700:'#4338ca' } }
        } } };
    </script>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body class="font-sans bg-canvas text-ink min-h-screen grid place-items-center px-6">
<div class="max-w-md text-center">
    <p class="font-display font-extrabold text-6xl text-brand-600" th:text="${code} ?: '500'">500</p>
    <h1 class="font-display font-bold text-xl mt-3" th:text="${title} ?: 'Something went wrong'">Something went wrong</h1>
    <p class="text-sm text-slate-500 mt-2" th:text="${message} ?: 'The action could not be completed.'">Message</p>
    <a th:href="@{/dashboard}" class="btn btn-primary mt-6"><i class="bi bi-house"></i> Back to dashboard</a>
</div>
</body>
</html>
