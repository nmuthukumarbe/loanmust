<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}">
<head><title>Record fee</title></head>
<body>
<div layout:fragment="page-title">Record fee</div>

<div layout:fragment="content">
    <div class="max-w-3xl">
        <div th:replace="~{fragments/ui :: crumbs(parent='Fee Receipts', parentUrl='/finance/receipts', current='Record fee')}"></div>

        <form th:action="@{/finance/receipts/save}" method="post" class="card p-6 space-y-6">

            <div>
                <h3 class="font-display font-bold mb-1">Received from</h3>
                <p class="text-xs text-slate-400 mb-4">A numbered receipt is generated on save and can be printed for the customer.</p>

                <div th:if="${receipt.applicationId != null}" class="mb-4 rounded-xl bg-brand-50 border border-brand-100 px-4 py-3 text-sm text-brand-800 flex items-center gap-3">
                    <i class="bi bi-folder2-open text-brand-600"></i>
                    <span>Against loan file <b th:text="${receipt.applicationCode}">LF-0001</b> — the customer is taken from the file.</span>
                    <input type="hidden" name="applicationId" th:value="${receipt.applicationId}"/>
                </div>

                <div class="grid sm:grid-cols-2 gap-5">
                    <div class="sm:col-span-2">
                        <label class="form-label">Customer</label>
                        <select name="customerId" class="form-select" required>
                            <option value="">Select customer…</option>
                            <option th:each="c : ${customers}" th:value="${c.id}"
                                    th:text="${c.name} + ' — ' + ${c.code} + (${c.mobile} != null ? ' · ' + ${c.mobile} : '')"
                                    th:selected="${receipt.customerId != null and receipt.customerId == c.id}">Customer</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="border-t border-slate-100 pt-6">
                <h3 class="font-display font-bold mb-4">Payment</h3>
                <div class="grid sm:grid-cols-2 gap-5">
                    <div>
                        <label class="form-label">Towards</label>
                        <select name="feeType" class="form-select">
                            <option th:each="f : ${feeTypes}" th:value="${f.name()}" th:text="${f.label}"
                                    th:selected="${receipt.feeType != null and receipt.feeType.name() == f.name()}">Fee</option>
                        </select>
                    </div>
                    <div>
                        <label class="form-label">Amount (₹)</label>
                        <input type="number" step="0.01" min="0.01" name="amount" th:value="${receipt.amount}" required class="form-input" placeholder="0.00"/>
                    </div>
                    <div>
                        <label class="form-label">Received on</label>
                        <input type="date" name="receivedOn" th:value="${receipt.receivedOn}" class="form-input"/>
                    </div>
                    <div>
                        <label class="form-label">Payment mode</label>
                        <select name="paymentMode" class="form-select">
                            <option th:each="m : ${paymentModes}" th:value="${m.name()}" th:text="${m.label}"
                                    th:selected="${receipt.paymentMode != null and receipt.paymentMode.name() == m.name()}">UPI</option>
                        </select>
                    </div>
                    <div class="sm:col-span-2">
                        <label class="form-label">Reference</label>
                        <input type="text" name="reference" th:value="${receipt.reference}" class="form-input" placeholder="UPI txn id, cheque no. or UTR"/>
                    </div>
                    <div class="sm:col-span-2">
                        <label class="form-label">Remarks</label>
                        <textarea name="remarks" rows="2" class="form-textarea" th:text="${receipt.remarks}"></textarea>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-3 border-t border-slate-100 pt-5">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Save receipt</button>
                <a th:href="@{/finance/receipts}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
