# ================= Loanmust =================
# Loan Agent (DSA) Management Platform.
# Single configuration file. Dev-friendly defaults; override the marked values via
# environment variables in production. Datasource: MariaDB.
# No secret is committed here - every credential comes from the environment.

spring.application.name=loanmust
server.port=${PORT:8080}

# ---- MariaDB datasource ----
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/loanmust_db?useSSL=false&serverTimezone=Asia/Kolkata&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# ---- Hikari connection pool ----
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=30000

# ---- JPA / Hibernate ----
# 'update' keeps data across restarts in dev; set JPA_DDL_AUTO=validate in production
# (where the schema is managed by db/migrations).
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW:true}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# ---- Session ----
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true

# ---- Thymeleaf (set THYMELEAF_CACHE=true in production) ----
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# ---- HTTP ----
server.compression.enabled=${HTTP_COMPRESSION:true}
server.compression.mime-types=text/html,text/css,application/javascript,application/json,image/svg+xml
server.forward-headers-strategy=framework

# ---- Date/time binding for HTML <input type="date|time|datetime-local"> ----
spring.mvc.format.date=yyyy-MM-dd
spring.mvc.format.time=HH:mm
spring.mvc.format.date-time=yyyy-MM-dd'T'HH:mm

# ---- Multipart (KYC, income and property documents) ----
# Phone photos of documents are large; a request can carry one file at a time.
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:15MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:20MB}
server.tomcat.max-swallow-size=25MB

# ---- Document storage (local disk; mount as a volume in Docker) ----
app.storage.local-dir=${STORAGE_LOCAL_DIR:storage-data}

# ---- Actuator (health only, for load balancers) ----
management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:health}
management.endpoint.health.show-details=never

# ---- Public base URL used in referral links and shared proposals ----
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}

# ---- Currency shown across the app ----
app.currency-symbol=${APP_CURRENCY_SYMBOL:₹}
app.currency-code=${APP_CURRENCY:INR}

# ---- Lender payouts unpaid 60 days after disbursal are flagged overdue (cron) ----
app.payout.overdue-cron=${PAYOUT_OVERDUE_CRON:0 30 6 * * *}

# ---- Demo data ----
# Seeds a demo loan book (builders, partners, leads, files at every stage, payouts, MODD)
# on an empty database so every screen has data. The Docker image turns this OFF.
app.demo.seed-transactions=${DEMO_SEED_TRANSACTIONS:true}
