<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" role="img" aria-labelledby="t">
  <title id="t">A happy couple holding the key to their new home</title>
  <style>
    .key { transform-origin: 356px 118px; animation: wiggle 3.2s ease-in-out infinite; }
    .heart { animation: rise 4s ease-in infinite; opacity: 0; }
    .heart.h2 { animation-delay: 1.4s; }
    .heart.h3 { animation-delay: 2.6s; }
    .sun { transform-origin: 430px 70px; animation: spin 40s linear infinite; }
    @keyframes wiggle { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(10deg); } }
    @keyframes rise { 0% { opacity: 0; transform: translateY(0) scale(.6); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-70px) scale(1.1); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .key, .heart, .sun { animation: none; } .heart { opacity: 1; } }
  </style>

  <!-- backdrop -->
  <circle cx="260" cy="240" r="200" fill="#ffffff" fill-opacity=".08"/>
  <circle cx="260" cy="240" r="150" fill="#ffffff" fill-opacity=".07"/>
  <g class="sun">
    <circle cx="430" cy="70" r="22" fill="#fcd34d"/>
    <g stroke="#fcd34d" stroke-width="4" stroke-linecap="round">
      <line x1="430" y1="30" x2="430" y2="38"/><line x1="430" y1="102" x2="430" y2="110"/>
      <line x1="390" y1="70" x2="398" y2="70"/><line x1="462" y1="70" x2="470" y2="70"/>
      <line x1="402" y1="42" x2="408" y2="48"/><line x1="452" y1="92" x2="458" y2="98"/>
      <line x1="402" y1="98" x2="408" y2="92"/><line x1="452" y1="48" x2="458" y2="42"/>
    </g>
  </g>

  <!-- house -->
  <g>
    <rect x="300" y="200" width="170" height="170" rx="6" fill="#ffffff"/>
    <path d="M285 210 385 128 485 210z" fill="#f97316"/>
    <path d="M285 210 385 128 485 210" fill="none" stroke="#ea580c" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="440" y="140" width="18" height="40" fill="#c2410c"/>
    <rect x="370" y="290" width="40" height="80" rx="4" fill="#4338ca"/>
    <circle cx="402" cy="332" r="3" fill="#fcd34d"/>
    <rect x="318" y="230" width="44" height="40" rx="4" fill="#bae6fd"/>
    <path d="M340 230v40M318 250h44" stroke="#ffffff" stroke-width="4"/>
    <rect x="418" y="230" width="38" height="40" rx="4" fill="#bae6fd"/>
    <path d="M437 230v40M418 250h38" stroke="#ffffff" stroke-width="4"/>
    <circle cx="385" cy="178" r="12" fill="#fde68a"/>
  </g>

  <!-- shrubs -->
  <ellipse cx="300" cy="368" rx="30" ry="18" fill="#34d399"/>
  <ellipse cx="478" cy="368" rx="26" ry="16" fill="#34d399"/>
  <ellipse cx="60" cy="372" rx="34" ry="18" fill="#34d399" fill-opacity=".8"/>

  <!-- ground -->
  <ellipse cx="260" cy="388" rx="240" ry="22" fill="#000000" fill-opacity=".15"/>

  <!-- ===== man ===== -->
  <g>
    <!-- legs -->
    <rect x="138" y="292" width="22" height="86" rx="10" fill="#1e293b"/>
    <rect x="166" y="292" width="22" height="86" rx="10" fill="#1e293b"/>
    <ellipse cx="146" cy="380" rx="16" ry="7" fill="#0f172a"/>
    <ellipse cx="180" cy="380" rx="16" ry="7" fill="#0f172a"/>
    <!-- left arm (hanging) -->
    <path d="M132 214 C116 240 116 270 122 296" stroke="#0ea5e9" stroke-width="20" fill="none" stroke-linecap="round"/>
    <circle cx="122" cy="300" r="10" fill="#b77b4e"/>
    <!-- torso -->
    <path d="M128 216 Q163 196 198 216 L194 304 Q163 312 132 304z" fill="#0ea5e9"/>
    <path d="M150 204 L163 228 L176 204" fill="#ffffff"/>
    <path d="M163 228v70" stroke="#0284c7" stroke-width="2"/>
    <!-- neck + head -->
    <rect x="155" y="186" width="16" height="22" rx="6" fill="#a86f45"/>
    <circle cx="163" cy="166" r="28" fill="#b77b4e"/>
    <path d="M135 162 C134 132 192 128 192 160 C186 148 172 146 164 150 C154 144 140 150 135 162z" fill="#111827"/>
    <circle cx="153" cy="168" r="3" fill="#111827"/>
    <circle cx="173" cy="168" r="3" fill="#111827"/>
    <path d="M152 180 Q163 189 174 180" stroke="#111827" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M150 184 Q163 196 176 184" stroke="#111827" stroke-width="2" fill="none" opacity=".5"/>
  </g>

  <!-- ===== woman ===== -->
  <g>
    <!-- hair behind -->
    <path d="M222 168 C214 214 226 238 236 246 L284 246 C294 236 304 212 294 168z" fill="#111827"/>
    <!-- kurta / dress -->
    <path d="M226 222 Q258 204 290 222 L304 372 Q258 384 212 372z" fill="#ec4899"/>
    <path d="M226 222 Q258 204 290 222 L284 238 Q258 226 232 238z" fill="#db2777"/>
    <!-- dupatta -->
    <path d="M286 224 C266 270 236 300 214 330" stroke="#fbbf24" stroke-width="12" fill="none" stroke-linecap="round"/>
    <!-- feet -->
    <ellipse cx="240" cy="380" rx="14" ry="6" fill="#0f172a"/>
    <ellipse cx="276" cy="380" rx="14" ry="6" fill="#0f172a"/>
    <!-- raised arm holding key -->
    <path d="M290 226 C316 206 336 170 348 132" stroke="#ec4899" stroke-width="18" fill="none" stroke-linecap="round"/>
    <circle cx="350" cy="124" r="10" fill="#c98a5a"/>
    <g class="key">
      <circle cx="356" cy="104" r="12" fill="none" stroke="#fcd34d" stroke-width="6"/>
      <path d="M356 116v-0 M356 116 L356 120" stroke="#fcd34d" stroke-width="6"/>
      <path d="M362 112 L382 132 M374 124l-6 6 M380 130l-6 6" stroke="#fcd34d" stroke-width="6" stroke-linecap="round"/>
    </g>
    <!-- neck + head -->
    <rect x="250" y="194" width="14" height="20" rx="6" fill="#b87a4b"/>
    <circle cx="258" cy="176" r="25" fill="#c98a5a"/>
    <path d="M233 172 C230 146 286 140 284 172 C276 156 254 152 240 162z" fill="#111827"/>
    <circle cx="282" cy="160" r="9" fill="#111827"/>
    <circle cx="258" cy="160" r="2.5" fill="#ef4444"/>
    <circle cx="249" cy="178" r="2.8" fill="#111827"/>
    <circle cx="267" cy="178" r="2.8" fill="#111827"/>
    <path d="M249 188 Q258 196 267 188" stroke="#111827" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="236" cy="188" r="3" fill="#fbbf24"/>
  </g>

  <!-- man's arm around her shoulder -->
  <path d="M194 220 C214 210 232 212 244 226" stroke="#0ea5e9" stroke-width="18" fill="none" stroke-linecap="round"/>
  <circle cx="248" cy="230" r="9" fill="#b77b4e"/>

  <!-- hearts -->
  <path class="heart" d="M210 120c-6-8-18-2-12 8l12 12 12-12c6-10-6-16-12-8z" fill="#f472b6"/>
  <path class="heart h2" d="M120 140c-5-6-14-1-9 6l9 9 9-9c5-7-4-12-9-6z" fill="#fda4af"/>
  <path class="heart h3" d="M300 96c-5-6-14-1-9 6l9 9 9-9c5-7-4-12-9-6z" fill="#f9a8d4"/>
</svg>
